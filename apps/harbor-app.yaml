apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.goharbor.io
    chart: harbor
    targetRevision: 1.18.2   # replace with desired chart version
    helm:
      values: |
        expose:
          type: ingress
          ingress:
            hosts:
              core: harbor.lab
            annotations:
              kubernetes.io/ingress.class: nginx
        externalURL: https://harbor.example.com
        harborAdminPassword: YourStrongPasswordHere
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
